[package]
name = "quarterdeck"
version = "0.1.0"
description = "A calm command deck for work and life done with Claude"
authors = ["Oscar Scull"]
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/oscscull/quarterdeck"
readme = "../README.md"
keywords = ["scheduler", "tauri", "claude", "productivity"]
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quarterdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Checks `schema/` and `migrations/` and generates the typed database client into OUT_DIR.
based-build = { git = "https://github.com/oscscull/baseddsl" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
croner = "4.0.1"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.0", features = ["process", "time", "io-util", "macros"] }
toml = "1.1.8"
sha2 = "0.10"
tauri-plugin-notification = "2.7.0"
schemars = "0.8"
ical = { version = "0.11", default-features = false, features = ["ical"] }
rrule = "0.14.0"
toml_edit = "0.25.17"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# The home and app-data folders on every platform (Tauri uses it too).
dirs = "6"
# This Mac's account name, for the account Claude Code logs in as.
nix = { version = "0.31", features = ["user"] }
tiny_http = "0.12.0"
uuid = { version = "1.28.0", features = ["v4"] }
# The database engine, over a bundled SQLite.
based-runtime = { git = "https://github.com/oscscull/baseddsl", default-features = false, features = ["sqlite-rusqlite", "id-gen"] }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Groups (lower priority so single lints below can override).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Restriction picks: no panicking paths in app code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
let_underscore_must_use = "deny"
string_slice = "deny"
clone_on_ref_ptr = "deny"
# Keep code small and explicit.
shadow_unrelated = "deny"
wildcard_enum_match_arm = "deny"
allow_attributes_without_reason = "deny"
# Tauri's dependency tree pulls duplicate crate versions; not actionable here.
multiple_crate_versions = "allow"

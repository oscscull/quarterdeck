# Mechanical settings only. Behaviour lives in prompts/ and schedules/.

# This machine's name. Each area below says which machine runs its schedules.
node = "work-mac"

# Start Quarterdeck when you log in, so schedules and alerts keep working. Closing the window keeps
# it running in the menu bar; quit from there.
launch_at_login = true

# How many asks Today's Priorities section shows, taken from the top of the ranking.
priority_limit = 3

# How many earlier messages in the "Ask Claude" chat go to Claude with each new one. The chat
# itself lasts until the app restarts.
chat_history_messages = 20


# How Claude may act in a project's worktree: "auto" lets Claude judge what's safe, as in your own
# sessions; "acceptEdits" allows edits but only the commands the project's allow rules list.
project_permission_mode = "auto"

# Command used to run Claude headlessly (`<command> -p "<prompt>"`).
claude_command = "claude"

# How long stored agent output lives before it is deleted.
activity_ttl_days = 7
run_ttl_days = 14
# Events (what happened, and which schedules it started).
event_ttl_days = 3
done_todo_ttl_days = 1
# Done work items, with their history, are deleted this long after they finish.
done_item_ttl_days = 30

# Areas of your life Quarterdeck keeps apart. Everything belongs to one. Rename, recolour or add more.
# `node` is the machine that runs that area's schedules.
[[areas]]
id = "work"
name = "Work"
color = "#3b6fd8"
node = "work-mac"

[[areas]]
id = "projects"
name = "Projects"
color = "#8a5cc7"
node = "home-mac"

[[areas]]
id = "life"
name = "Life"
color = "#2e8a47"
node = "home-mac"

# Your open PRs (and, if you watch them, issues) become items, through the `gh` command's existing login. Quarterdeck only rewrites a
# PR's title, stage and status when they change on GitHub, so your edits stick in between.
[github]
enabled = true
poll_minutes = 5
# Coming back to Quarterdeck's window syncs at once (e.g. right after you merge a PR in the browser),
# unless a sync ran within this many seconds.
focus_sync_seconds = 30
default_area = "work"
# Skip PRs from these owners or repos.
ignore = []
# Owners or repos where you review your own PRs. PRs with no requested reviewers already count.
self_review = []
# Quarterdeck reads CI state from GitHub itself (no tokens). When CI finishes on an item Claude has
# claimed, Quarterdeck tells that Claude session, so agents never poll CI. When CI fails on a PR nobody
# is on, and no ci_failed schedule covers it, Quarterdeck hands it to Claude (prompts/fix-ci.md).
fix_ci = true
fix_ci_tools = ["Bash(gh pr checks:*)", "Bash(gh pr view:*)", "Bash(gh run view:*)", "Bash(gh run rerun:*)"]
# Where a repo only merges branches that are up to date, a PR that falls behind (say, while it waits
# on review) has its branch updated by Quarterdeck (`gh pr update-branch`, no Claude). A PR that
# starts conflicting goes to the Claude session on it, or, if nobody is on it, to a new one
# (prompts/fix-conflicts.md). A pr_behind or pr_conflicts schedule takes over from either.
update_behind = true
fix_conflicts = true

# Where repos are checked out on this machine. Work Quarterdeck starts on their PRs (fixing CI, acting
# on your answers), or on items linking their issues, runs there, in a worktree per item, with the
# project's own Claude settings.
# [[projects]]
# repo = "me/webapp"
# path = "~/code/webapp"

# Items Claude works on one at a time, in this order (set_queue). The first not yet in review or done
# starts when it's up next (prompts/queue.md, delivered like "Tell Claude"); the next waits until it's
# in review or done. An item linking a GitHub issue in a repo above gets a branch of its own, and
# Quarterdeck pushes it and opens the PR when Claude finishes.
[queue]
items = []

# Open issues of these owners ("me") or repos ("my-org/app") become items to triage, filed like their
# PRs ([github.areas]). Issues one of your open PRs closes are left to that PR's item. Delete an
# issue's item to drop it from view; syncs keep it hidden.
[github.issues]
watch = []
skip_labels = []

# Checks that only inform (e.g. a visual-diff report). Their failures don't count as CI failing;
# they're noted on the item instead.
[github.informational_checks]
# "me/webapp" = ["reg"]

# Owner or owner/repo to area id. A repo entry beats its owner's.
[github.areas]
# "my-org" = "work"
# "me/side-project" = "projects"

# Calendars become meetings on Today, alerted before they start. Give each calendar's private iCal
# link (Google: Settings > your calendar > "Secret address in iCal format"), or, on a Mac, its title
# in the Calendar app (`mac_calendar`) for accounts with no link. Hide or re-file any event in
# Quarterdeck and the next sync keeps it that way.
[calendar]
poll_minutes = 15
days_ahead = 14
ignore_all_day = true
# Skip events whose title contains any of these.
ignore_titles = []

# [[calendar.feeds]]
# name = "work"
# url = "https://calendar.google.com/calendar/ical/.../basic.ics"
# area = "work"
# ignore_titles = ["Lunch"]
#
# [[calendar.feeds]]
# name = "labs"
# mac_calendar = "me@work.example"   # or "account/title" when two accounts share a title
# area = "work"

# The on-top countdown before each meeting, with a chime.
[alerts]
enabled = true
lead_minutes = 5
linger_minutes = 3

# Other machines running Quarterdeck. Each serves its own data on `port` (localhost only); expose it
# with a tunnel you run (Tailscale, ngrok, ssh -L) and add it as a peer on the other machine.
# Areas whose `node` is a peer show that machine's data here, and edits go back to it.
[sync]
enabled = false
port = 4791
# Also accept machines on the local network (private addresses only), so two Macs on the same
# Wi-Fi sync with no tunnel. Off: this machine only, for use behind a tunnel.
lan = false
# Peers must send this. Made on first start when empty.
token = ""

# [[sync.peers]]
# name = "home-mac"
# url = "http://Home-Mac.local:4791"     # `scutil --get LocalHostName` on that Mac, plus .local
# token = "the token from home-mac's quarterdeck.toml"

# Every item in flight has a turn: yours, the agent's, others' (reviewers, CI) or later. Each has a
# clock, so nothing sits forever. The agent's turn ends when it hands it on, or after agent_hours
# (back to you). Your turn reminds you every you_remind_hours. Others' turn comes back after
# others_hours, to others_then ("you" or "agent") unless the item says otherwise. An agent session
# working outside Quarterdeck that goes quiet for quiet_minutes is prompted to carry on.
[turns]
agent_hours = 4
you_remind_hours = 24
others_hours = 24
later_hours = 72
others_then = "you"
quiet_minutes = 45

# When the agent can't run at all (offline, `claude` missing), its work waits instead of failing:
# one card says so, and its items keep the agent's turn. Quarterdeck checks again after
# first_retry_seconds, doubling the wait each time up to max_retry_seconds; coming back to the
# window checks at once. `probe` is a host:port the agent needs ("" checks only for `claude`).
[outage]
first_retry_seconds = 60
max_retry_seconds = 900
probe = "api.anthropic.com:443"
probe_timeout_seconds = 5

# Every merge to main publishes a release; Quarterdeck installs it by itself, so every machine runs
# the same build. It waits until no Claude run is live and you're not in the window, then restarts.
[updates]
enabled = true
check_minutes = 30

# Only dev builds (`npm run tauri dev`) read this. A dev build keeps its own data and config, apart
# from the installed app; `npm run dev:seed` copies the installed app's into it.
[dev]
# Let this dev build run Claude. Off, every run fails at once, so a copy of real data can't resume
# real sessions or push to real PRs.
run_claude = false
# Let this dev build run script schedules. Off for the same reason.
run_scripts = false
